name: iOSXR
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  iOSXR:
    type: application
    platform: iOS
    sources:
      - path: Sources/iOSXR
        excludes:
          - Info.plist
    info:
      path: Sources/iOSXR/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.iosxr
        PRODUCT_NAME: iOSXR
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
